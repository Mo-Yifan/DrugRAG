<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="基于 DrugBank 数据库的临床药物问答系统，提供权威、可溯源的药学信息。" />
    <title>{% block title %}DrugBank 临床问答助手{% endblock %}</title>
    
    <!-- 引入外部样式 -->
    <link rel="stylesheet" href="/static/css/style.css" />
    
    <!-- 可选：添加 favicon（如有） -->
    <!-- <link rel="icon" type="image/x-icon" href="/static/favicon.ico"> -->
</head>
<body>
    <div class="container">
        <header>
            <h1>💊 DrugBank 临床问答助手</h1>
            <p class="subtitle">
                基于权威 DrugBank 数据库的药物信息查询系统 · 所有回答均附带来源引用
            </p>
        </header>

        <!-- 子模板内容区域 -->
        {% block content %}
        {% endblock %}

        <footer>
            <p>
                © 2026 DrugBank RAG 系统 | 
                数据来源：<a href="https://go.drugbank.com" target="_blank" rel="noopener noreferrer">DrugBank</a> | 
                本系统仅用于科研与教育目的
            </p>
        </footer>
    </div>

    <!-- 全局 JavaScript -->
    <script src="/static/js/main.js"></script>
    
    <!-- 子模板可追加额外脚本 -->
    {% block extra_js %}
    {% endblock %}
</body>
</html>
